# LiveKit media server config for deploy/docker-compose.yml.
# API keys come from the LIVEKIT_KEYS environment variable.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Discover the server's public IP so browsers can reach it directly.
  use_external_ip: true
turn:
  # Relay for people behind strict firewalls (UDP 3478).
  enabled: true
  udp_port: 3478
room:
  empty_timeout: 300
  max_participants: 120
logging:
  level: warn
